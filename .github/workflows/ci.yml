name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  SING_BOX_VERSION: 1.14.0
  SING_BOX_LINUX_AMD64_MUSL_SHA256: d2d6b4543d850269214ced70ffe41b13b1595baa1b6f9c016466abfba162c4d4

jobs:
  linux-openwrt:
    name: Test Linux and OpenWrt
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check source and packaging contracts
        run: |
          python3 tests/check-luci-i18n.py
          python3 tests/check-package-boundaries.py
          python3 tests/check-build-cache.py
          python3 tests/check-linux-packaging.py
          python3 tests/check-macos-packaging.py
          python3 tests/check-ui-contract.py

      - name: Check JavaScript and web interactions
        run: |
          node tests/node/luci_view_test.js
          node tests/node/steer_helper_test.js
          node tests/node/linux_web_test.js

      - name: Check shared Go core and platform adapters
        working-directory: go
        run: |
          go test -race ./...
          go vet ./...

      - name: Compile every supported Linux and OpenWrt target
        working-directory: go
        run: |
          mkdir -p "$RUNNER_TEMP/steer-platform-smoke"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o "$RUNNER_TEMP/steer-platform-smoke/steer-openwrt-x86_64" \
            ./cmd/steer-openwrt
          for target in amd64:x86_64 arm64:aarch64; do
            goarch="${target%%:*}"
            release_arch="${target#*:}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" go build \
              -o "$RUNNER_TEMP/steer-platform-smoke/steer-linux-$release_arch" \
              ./cmd/steer-linux
          done

      - name: Lint shell and property lists
        run: |
          sh -n macos/scripts/install-launchdaemon.sh
          sh -n macos/scripts/install-embedded-payload.sh
          sh -n macos/scripts/build-app-bundle.sh
          sh -n tests/integration/run-openwrt-vm.sh
          sh -n tests/integration/run-linux-system.sh
          sh -n tests/integration/start-linux-system-container.sh
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          for path in Path("macos").rglob("*.plist"):
              with path.open("rb") as source:
                  plistlib.load(source)
          PY

  linux-system:
    name: Test Linux system integration
    needs: linux-openwrt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build disposable Linux test inputs
        run: |
          mkdir -p "$RUNNER_TEMP/steer-linux-system/geodata-seed"
          (
            cd go
            STEER_DNS_FIXTURE_DIR="$RUNNER_TEMP/steer-linux-system/dns-fixtures" \
              go test ./internal/platform -run TestExportNativeDNSFixtures -count=1
            CGO_ENABLED=0 go build -o "$RUNNER_TEMP/steer-linux-system/steer-openwrt" ./cmd/steer-openwrt
            CGO_ENABLED=0 go build \
              -trimpath \
              -o "$RUNNER_TEMP/steer-linux-system/steer" \
              ./cmd/steer-linux
          )
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/steer-linux-system/sing-box.tar.gz" \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64-musl.tar.gz"
          printf '%s  %s\n' \
            "$SING_BOX_LINUX_AMD64_MUSL_SHA256" \
            "$RUNNER_TEMP/steer-linux-system/sing-box.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/steer-linux-system/sing-box.tar.gz" \
            -C "$RUNNER_TEMP/steer-linux-system"
          install -m 755 \
            "$RUNNER_TEMP/steer-linux-system/sing-box-$SING_BOX_VERSION-linux-amd64-musl/sing-box" \
            "$RUNNER_TEMP/steer-linux-system/sing-box"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/steer-linux-system/geodata.tar.zst" \
            https://gsh20040816.github.io/steer/geodata/latest/steer-geodata.tar.zst
          tar --zstd -xf "$RUNNER_TEMP/steer-linux-system/geodata.tar.zst" \
            -C "$RUNNER_TEMP/steer-linux-system/geodata-seed"
          (
            cd go
            go run ./cmd/steer-geodata-build verify \
              --directory "$RUNNER_TEMP/steer-linux-system/geodata-seed"
          )

      - name: Build disposable systemd container
        run: docker build --file tests/integration/linux-system.Dockerfile --tag steer-linux-system:test .

      - name: Start disposable systemd container
        run: |
          sh tests/integration/start-linux-system-container.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/steer-linux-system"

      - name: Run Linux system integration
        run: |
          docker exec \
            --env STEER_LINUX_SYSTEM_TEST=1 \
            --env STEER_SOURCE_ROOT=/workspace \
            --env STEER_BINARY=/artifacts/steer \
            --env SING_BOX_BINARY=/artifacts/sing-box \
            --env STEER_GEODATA_SEED=/artifacts/geodata-seed \
            steer-linux-system \
            /workspace/tests/integration/run-linux-system.sh

      - name: Test native DNS and IPv6 relay topology
        run: |
          for platform in linux openwrt; do
            docker exec --env PATH=/artifacts:/usr/sbin:/usr/bin:/sbin:/bin \
              steer-linux-system python3 /workspace/tests/integration/check-native-dns.py \
              "/artifacts/dns-fixtures/$platform.json" \
              "/artifacts/dns-fixtures/$platform.nft"
          done

      - name: Test OpenWrt netlink overload recovery
        run: |
          docker exec steer-linux-system python3 /workspace/tests/integration/check-netlink-guard.py \
            /artifacts/steer-openwrt /artifacts/sing-box

      - name: Stop disposable systemd container
        if: always()
        run: |
          docker stop steer-linux-system >/dev/null 2>&1 || true
          docker container rm steer-linux-system >/dev/null 2>&1 || true

  macos:
    name: Test macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            goarch: arm64
          - runner: macos-26-intel
            arch: x86_64
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go from the module requirement
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Confirm native architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version | grep -Fqx 'Xcode 26.6'

      - name: Test shared Go core and native macOS adapter
        working-directory: go
        run: |
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.goarch }} go build \
            -o "$RUNNER_TEMP/steer-macos" \
            ./cmd/steer-macos

      - name: Test and build Swift GUI in debug and release modes
        working-directory: macos
        run: |
          plutil -lint launchd/com.steer.steer.plist launchd/com.steer.steer.control.plist
          swift test --disable-sandbox
          swift build -c debug --disable-sandbox
          swift build -c release --disable-sandbox
          app_binary="$(swift build -c release --show-bin-path)/SteerApp"
          test "$(xcrun vtool -show-build "$app_binary" | awk '$1 == "minos" {print $2; exit}')" = 13.0
          test "$(xcrun vtool -show-build "$app_binary" | awk '$1 == "sdk" {print $2; exit}' | cut -d. -f1)" = 26
